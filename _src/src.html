<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  function h(tag, props) {
    const el = document.createElement(tag);
    if (props) Object.keys(props).forEach(k => {
      const v = props[k]; if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v; else if (k === 'html') el.innerHTML = v; else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v); else if (k === 'value') el.value = v; else el.setAttribute(k, v === true ? '' : v);
    });
    (function add(list) { list.forEach(c => { if (c === null || c === undefined || c === false) return; if (Array.isArray(c)) add(c); else el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c); }); })(Array.prototype.slice.call(arguments, 2));
    return el;
  }
  let toastT = null;
  function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
  function photoById(P, id) { return P.photos.find(p => p.id === id); }

/*__PAGES__*/

  /* ============================================================
     ほぞん（IndexedDB）
     ============================================================ */
  const DB = (() => {
    let dbp = null; const mem = {};
    function open() {
      if (dbp) return dbp;
      dbp = new Promise(res => {
        try { const r = indexedDB.open('mieel-shukudai', 1); r.onupgradeneeded = () => r.result.createObjectStore('projects', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); }
      });
      return dbp;
    }
    const tx = (mode, fn) => open().then(db => db ? new Promise((res, rej) => { const t = db.transaction('projects', mode), s = t.objectStore('projects'), q = fn(s); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }) : null);
    return {
      put: o => tx('readwrite', s => s.put(o)).then(r => { if (r === null) mem[o.id] = o; }),
      get: id => tx('readonly', s => s.get(id)).then(r => r === null ? mem[id] : r),
      all: () => tx('readonly', s => s.getAll()).then(r => r === null ? Object.values(mem) : r),
      del: id => tx('readwrite', s => s.delete(id)).then(r => { if (r === null) delete mem[id]; })
    };
  })();
  const LS = 'shukudai.last';
  function defaultDates(kind) {
    const n = new Date(); let y = n.getFullYear();
    if (kind === 'winter') { if (n.getMonth() < 2) y--; return [y + '-12-25', (y + 1) + '-01-07']; }
    if (kind === 'spring') { if (n.getMonth() > 3) y++; return [y + '-03-24', y + '-04-06']; }
    if (n.getMonth() > 8) y++;
    return [y + '-07-20', y + '-08-31'];
  }
  function mk(type, o) { return Object.assign({ pid: uid(), type }, PAGE_TYPES[type].def(), o || {}); }
  function defaultPages(kind) {
    if (kind === 'winter') return [mk('cover'), mk('list'), mk('calendar', { events: '1/1:おしょうがつ' }), mk('daily'), mk('diary', { count: 2 }), mk('kakizome'), mk('nengajo'), mk('writing'), mk('photos'), mk('chores'), mk('cert')];
    if (kind === 'spring') return [mk('cover'), mk('list'), mk('calendar'), mk('daily'), mk('diary', { count: 2 }), mk('photos'), mk('writing'), mk('cert')];
    return [mk('cover'), mk('list'), mk('calendar', { perPage: 2 }), mk('daily'), mk('diary'), mk('photos'), mk('observe'), mk('chores'), mk('rhythm'), mk('reading'), mk('writing'), mk('free'), mk('cert')];
  }
  function newProject(kind, base) {
    const d = defaultDates(kind);
    return Object.assign({ id: 'p' + uid(), v: 1, kind, start: d[0], end: d[1], child: '', school: '', klass: '', teacher: '', title: '',
      style: { nameMode: 'write', dateMode: 'write', writeMode: 'masu', masu: 'M', lineGap: 'M', weather: 'circle', kanji: false },
      pages: defaultPages(kind), photos: [], extCss: {}, coverPhoto: null, updated: Date.now() }, base || {});
  }
  let P = null, saveT = null;
  function touch(re) {
    P.updated = Date.now(); $('#status').textContent = '…';
    clearTimeout(saveT); saveT = setTimeout(() => DB.put(P).then(() => { $('#status').textContent = '✓ ほぞん しました'; }).catch(() => { $('#status').textContent = '⚠ ほぞん できません'; }), 500);
    if (re !== false) schedule();
  }

  /* ============================================================
     ほかの アプリの プリント（おなじ サイトの アプリを よびだす）
     ============================================================ */
  const ROOT = location.pathname.split('/').slice(0, -2).join('/') + '/';
  const CATALOG = [
    { g: '📚 こくご', apps: [['kazu1/hiragana1', 'あ', 'ひらがな'], ['kazu1/katakana', '🔤', 'カタカナ'], ['kazu1/dakuon_handakuon', 'が', 'だくおん・はんだくおん'], ['kazu1/kanji', '🈁', 'かんじ'], ['joshi', '🧩', 'じょしの れんしゅう'], ['kazu1/bunsyou', '📖', 'ぶんしょう れんしゅう'], ['kazu1/bunshoudai2', '🔎', 'ものがたりを よみとろう'], ['kazu1/kotobakimoti', '💬', 'ちくちく・あったか ことば'], ['kazu1/kurabekko', '🧩', 'くらべっこ']] },
    { g: '🔢 さんすう', apps: [['kazu1/kazu1', '🔢', 'かずを まなぼう'], ['kazu1/keisan', '➕', 'たしざん・ひきざん'], ['kazu1/bunshoudai', '🧮', 'ぶんしょうだい'], ['kazu1/tokei', '🕰️', 'とけい'], ['kazu1/jikan_keisan', '⏱️', 'じかんの けいさん'], ['kazu1/okane', '🪙', 'おかね'], ['kazu1/okane2', '🛒', 'おかいもの'], ['kazu1/nagasa', '📏', 'ながさ'], ['kazu1/omosa', '⚖️', 'おもさ'], ['kazu1/kasa', '🥤', 'かさ'], ['kazu1/katachi', '🔺', 'かたち'], ['kazu1/tizu_houkou', '🧭', 'ちずと ほうこう'], ['kazu1/youbi_karenda', '🗓️', 'ようびと カレンダー']] },
    { g: '🏠 せいかつ・なかまわけ', apps: [['nakamawake', '🧺', 'なかまわけ'], ['cooldown', '🌋', 'こころの火山 クールダウン'], ['kazu1/aisatu', '🙋', 'あいさつ'], ['kazu1/bousai', '🚨', 'ぼうさい'], ['kazu1/koutuu', '🚦', 'こうつう あんぜん'], ['kazu1/gomi_bunbetu', '🗑️', 'ごみの ぶんべつ'], ['kazu1/karadatokenkou', '🧍', 'からだと けんこう'], ['kazu1/kisetu_gyouji', '🎏', 'きせつと ぎょうじ']] }
  ];
  const apis = {};
  function loadApi(path) {
    if (apis[path]) return apis[path];
    const pr = new Promise((res, rej) => {
      const f = document.createElement('iframe');
      f.style.cssText = 'position:fixed;left:-12000px;top:0;width:1100px;height:1500px;border:0';
      f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
      let done = false; const fail = m => { if (!done) { done = true; f.remove(); rej(new Error(m)); } };
      f.onload = () => {
        let n = 0;
        const t = setInterval(() => {
          n++; let api = null;
          try { api = f.contentWindow.MieelPrintAPI; } catch (e) { clearInterval(t); return fail('cross'); }
          if (api) { clearInterval(t); done = true; res({ api, win: f.contentWindow }); }
          else if (n > 80) { clearInterval(t); fail('noapi'); }
        }, 150);
      };
      setTimeout(() => fail('timeout'), 25000);
      f.src = ROOT + path + '/?embed=1';
      document.body.appendChild(f);
    });
    apis[path] = pr; pr.catch(() => { delete apis[path]; });
    return pr;
  }
  // そのアプリの CSS（:root → :host、JS で つけた いろ なども いっしょに）
  function cssOf(win, css) {
    let extra = '';
    try { extra = win.document.documentElement.style.cssText || ''; } catch (e) { /* 無視 */ }
    return css.replace(/:root/g, ':host') + (extra ? '\n:host{' + extra + '}' : '');
  }
  async function buildExt(pg) {
    const { api, win } = await loadApi(pg.app);
    const pages = [];
    let css = '';
    for (let i = 0; i < Math.max(1, +pg.copies || 1); i++) { const r = await api.build(pg.item, pg.params || {}); css = r.css; r.pages.forEach(x => pages.push(x)); }
    P.extCss[pg.app] = cssOf(win, css);
    pg.cache = { pages, at: Date.now() };
  }
  function extHost(html, css) {
    const host = h('div', { class: 'bk-ext' });
    try { const sr = host.attachShadow({ mode: 'open' }); sr.innerHTML = '<style>' + css + '</style>' + html; }
    catch (e) { host.innerHTML = html; }
    return host;
  }

  /* ============================================================
     A4 ページを ならべる
     ============================================================ */
  function buildBook() {
    const items = [];
    P.pages.forEach(pg => {
      if (pg.type === 'ext') { ((pg.cache && pg.cache.pages) || []).forEach(x => items.push({ ext: true, html: x, css: P.extCss[pg.app] || '' })); return; }
      const T = PAGE_TYPES[pg.type]; if (!T) return;
      try { T.make(P, pg).forEach(x => items.push({ html: x })); }
      catch (e) { items.push({ html: '<div class="bk-page"><div class="err">ページを つくれませんでした：' + esc(T.n) + '（' + esc(e.message) + '）</div></div>' }); }

    openM(p => { if (path) { const a = CATALOG.reduce((x, c) => x.concat(c.apps), []).find(x => x[0] === path) || [path, edit.icon, edit.appTitle]; pickApp(a); } else draw(p, 'app'); });
  }

  /* ---------- しゃしん ---------- */
  function resize(file) {
    return new Promise((res, rej) => { const u = URL.createObjectURL(file), img = new Image(); img.onload = () => { const sc = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .82)); }; img.onerror = () => { URL.revokeObjectURL(u); rej(); }; img.src = u; });
  }
  $('#photoIn').addEventListener('change', async e => {
    const files = Array.from(e.target.files || []); e.target.value = '';
    if (!files.length) return;
    toast('しゃしんを よみこんで います…');
    for (const f of files) { try { const src = await resize(f); const d = f.lastModified ? ymd(new Date(f.lastModified)) : ''; P.photos.push({ id: 'ph' + uid(), src, date: d >= P.start && d <= P.end ? d : '', caption: '' }); } catch (err) { /* よめない ファイルは とばす */ } }
    P.photos.sort((a, b) => String(a.date || '9').localeCompare(String(b.date || '9')));
    openState.photos = true; touch(); renderEditor(); toast('しゃしんを ' + files.length + 'まい いれました');
  });

  /* ---------- こども（プロジェクト） ---------- */
  async function openProjects() {
    const list = (await DB.all()).sort((a, b) => b.updated - a.updated);
    openM(p => p.append(h('div', { class: 'phead' }, h('h2', null, '👦 こどもごとの しゅくだい'), h('button', { type: 'button', class: 'tb', onclick: closeM }, 'とじる')),
      h('p', { class: 'note' }, 'こどもごとに、かく ちから や ページを かえて ほぞん できます。「この せっていで あたらしく」で、いまの ページの くみあわせの まま べつの こを つくれます。'),
      h('div', { class: 'projs' }, list.map(x => h('div', { class: 'proj' + (x.id === P.id ? ' cur' : '') }, h('span', { class: 'emo', style: 'font-size:26px' }, (KINDS[x.kind] || KINDS.summer).icon),
        h('span', { class: 't' }, x.child || '（なまえ なし）', h('small', null, (KINDS[x.kind] || KINDS.summer).n + '・' + (x.pages || []).length + 'ページ・' + new Date(x.updated).toLocaleDateString('ja-JP'))),
        x.id !== P.id ? h('button', { type: 'button', class: 'tb', onclick: () => { P = x; localStorage.setItem(LS, P.id); updateProjName(); renderEditor(); schedule(); closeM(); } }, 'ひらく') : h('b', { style: 'color:var(--main-d)' }, 'いま'),
        h('button', { type: 'button', class: 'tb', onclick: async () => { if (!confirm('「' + (x.child || 'なまえ なし') + '」を けしますか？')) return; await DB.del(x.id); if (x.id === P.id) { const rest = (await DB.all()); P = rest[0] || newProject('summer'); await DB.put(P); updateProjName(); renderEditor(); schedule(); } openProjects(); } }, '🗑')))),
      h('div', { class: 'addrow' },
        h('button', { type: 'button', class: 'big', onclick: async () => { const nm = prompt('こどもの なまえ（あとで かえられます）', ''); if (nm === null) return; const c = JSON.parse(JSON.stringify(P)); Object.assign(c, { id: 'p' + uid(), child: nm, photos: [], coverPhoto: null, updated: Date.now() }); c.pages.forEach(x => { x.pid = uid(); }); P = c; await DB.put(P); localStorage.setItem(LS, P.id); updateProjName(); renderEditor(); schedule(); closeM(); toast(nm + ' さんを つくりました'); } }, '👥 この せっていで あたらしく'),
        h('span')),
      h('div', { class: 'gh' }, '＋ さいしょから つくる'),
      h('div', { class: 'addrow', style: 'grid-template-columns:1fr 1fr 1fr' }, ['summer', 'winter', 'spring'].map(kind => h('button', { type: 'button', class: 'big blue', onclick: async () => { P = newProject(kind); await DB.put(P); localStorage.setItem(LS, P.id); updateProjName(); renderEditor(); schedule(); closeM(); toast(KINDS[kind].n + 'の しゅくだいを つくりました'); } }, KINDS[kind].icon + ' ' + KINDS[kind].n)))));
  }

  /* ---------- ほぞん・よみこみ・いんさつ ---------- */
  function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  const fname = ext => ((KINDS[P.kind] || KINDS.summer).n + 'の しゅくだい_' + (P.child || 'なまえなし')).replace(/[\\/:*?"<>|\s]/g, '_') + '.' + ext;
  function bookHTML() {
    const items = buildBook();
    const body = items.map(it => it.ext ? '<div class="bk-ext"><template shadowrootmode="open"><style>' + it.css + '</style>' + it.html + '</template></div>' : it.html).join('\n');
    return '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(fname('').slice(0, -1)) + '</title>' +
      '<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Klee+One:wght@600&display=swap" rel="stylesheet">' +
      '<style>' + $('#bookCss').textContent + '\nbody{margin:0;background:#888}@page{size:A4 portrait;margin:0}body>*{margin:0 auto 10mm;box-shadow:0 2mm 6mm rgba(0,0,0,.3)}@media print{body{background:#fff}body>*{margin:0;box-shadow:none;break-after:page;page-break-after:always}body>*:last-child{break-after:auto}}</style></head><body>' + body + '</body></html>';
  }
  function openFile() {
    openM(p => p.append(h('div', { class: 'phead' }, h('h2', null, '💾 ほぞん・よみこみ'), h('button', { type: 'button', class: 'tb', onclick: closeM }, 'とじる')),
      h('p', { class: 'note' }, 'この アプリの なかには じどうで ほぞん されて います（この たんまつ だけ）。ほかの パソコンや iPad に うつす ときや、のこして おく ときに つかいます。'),
      h('div', { class: 'grid' },
        h('button', { type: 'button', class: 'gcard', onclick: doPrint }, h('span', { class: 'e emo' }, '🖨️'), h('span', null, h('b', null, 'いんさつ／PDFで ほぞん'), h('small', null, 'いんさつの がめんで「PDFに ほぞん」を えらぶと PDF に なります'))),
        h('button', { type: 'button', class: 'gcard', onclick: () => { download(fname('html'), bookHTML(), 'text/html'); toast('HTML ファイルを ほぞん しました'); } }, h('span', { class: 'e emo' }, '📄'), h('span', null, h('b', null, 'いんさつ よう ファイル（HTML）'), h('small', null, 'あとで ひらいて、いつでも いんさつ できる ファイル'))),
        h('button', { type: 'button', class: 'gcard', onclick: () => { download(fname('json'), JSON.stringify(P), 'application/json'); toast('データを ほぞん しました'); } }, h('span', { class: 'e emo' }, '💾'), h('span', null, h('b', null, 'データを ほぞん'), h('small', null, 'しゃしんも ふくめて ぜんぶ。べつの たんまつで よみこめます'))),
        h('button', { type: 'button', class: 'gcard', onclick: () => $('#jsonIn').click() }, h('span', { class: 'e emo' }, '📂'), h('span', null, h('b', null, 'データを よみこむ'), h('small', null, 'ほぞんした データを あたらしい こども として よみこみます'))))));
  }
  $('#jsonIn').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    const r = new FileReader();
    r.onload = async () => { try { const o = JSON.parse(String(r.result)); if (!o || !Array.isArray(o.pages) || !o.style) throw new Error(); o.id = 'p' + uid(); o.updated = Date.now(); o.extCss = o.extCss || {}; o.photos = o.photos || []; P = o; await DB.put(P); localStorage.setItem(LS, P.id); updateProjName(); renderEditor(); schedule(); closeM(); toast('よみこみました'); } catch (err) { toast('この ファイルは よみこめません'); } };
    r.readAsText(f);
  });
  async function doPrint() {
    closeM(); toast('じゅんびして います…');
    const root = $('#printRoot'); root.innerHTML = '';
    buildBook().forEach(it => root.appendChild(pageEl(it)));
    const imgs = Array.from(root.querySelectorAll('img'));
    await Promise.all(imgs.map(i => i.decode ? i.decode().catch(() => { }) : Promise.resolve()));
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    setTimeout(() => window.print(), 150);
  }
  window.addEventListener('afterprint', () => { $('#printRoot').innerHTML = ''; });
  $('#printBtn').addEventListener('click', doPrint);
  $('#fileBtn').addEventListener('click', openFile);
  $('#projBtn').addEventListener('click', openProjects);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

  /* ---------- はじめる ---------- */
  (async () => {
    const last = localStorage.getItem(LS);
    P = (last && await DB.get(last)) || (await DB.all()).sort((a, b) => b.updated - a.updated)[0];
    if (!P) { P = newProject('summer'); await DB.put(P); }
    P.extCss = P.extCss || {}; P.photos = P.photos || [];
    localStorage.setItem(LS, P.id);
    updateProjName(); renderEditor(); renderPreview();
    window.__hw = { get P() { return P; }, PAGE_TYPES, buildBook, bookHTML, pageEl, loadApi, buildExt, renderPreview, renderEditor, touch };
  })();
})();
</script>
</body>
